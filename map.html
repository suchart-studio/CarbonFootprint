<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khon Kaen Global Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-base: #030a10; --bg-panel: rgba(3, 20, 25, 0.8);
            --glow-green: #00ffcc; --glow-red: #ff3366; --text-main: #e0f8f5;
            --border-tech: 1px solid rgba(0, 255, 204, 0.3);
        }
        body { font-family: 'Chakra Petch', monospace; background-color: var(--bg-base); color: var(--text-main); margin: 0; padding: 10px; background-image: radial-gradient(circle at 50% 50%, #0a192f 0%, #030a10 100%);}
        
        .nav-bar { background: var(--bg-panel); padding: 15px; border: var(--border-tech); box-shadow: 0 0 10px rgba(0, 255, 204, 0.1); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .nav-bar a { color: var(--glow-green); text-decoration: none; font-weight: bold; font-family: monospace; }
        
        .dashboard-container { background: var(--bg-panel); padding: 20px; border: var(--border-tech); box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); backdrop-filter: blur(5px); }
        h2 { text-align: center; color: #fff; margin-top: 0; text-shadow: 0 0 10px var(--glow-green); letter-spacing: 2px;}
        
        .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .summary-card { padding: 20px; border: 1px solid; text-align: center; background: rgba(0,0,0,0.5); }
        .card-red { border-color: var(--glow-red); box-shadow: inset 0 0 20px rgba(255, 51, 102, 0.2); }
        .card-green { border-color: var(--glow-green); box-shadow: inset 0 0 20px rgba(0, 255, 204, 0.2); }
        
        .summary-card h4 { margin: 0; font-size: 14px; color: #81e6d9; font-family: monospace; }
        .summary-card h1 { margin: 10px 0 0 0; font-size: 32px; font-weight: bold; }
        .card-red h1 { color: var(--glow-red); text-shadow: 0 0 10px var(--glow-red); }
        .card-green h1 { color: var(--glow-green); text-shadow: 0 0 10px var(--glow-green); }

        #cityMap { height: 65vh; width: 100%; border: var(--border-tech); filter: contrast(1.1); }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0f172a; color: #e2e8f0; border: 1px solid var(--glow-green); }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html"><< RETURN_TO_TERMINAL</a>
        <span style="color: #4fd1c5; font-family: monospace;">[ ENV_NETWORK: ONLINE ]</span>
    </div>

    <div class="dashboard-container">
        <h2>GLOBAL DATA MATRIX</h2>
        <div id="loading" style="text-align:center; color:#00ffcc; font-family:monospace; margin:20px 0;">SYNCING WITH SATELLITES...</div>

        <div class="summary-grid" id="summaryGrid" style="display: none;">
            <div class="summary-card card-red">
                <h4>[ TOTAL EMISSION DETECTED ]</h4>
                <h1 id="totalCityFootprint">0.00</h1>
            </div>
            <div class="summary-card card-green">
                <h4>[ TOTAL REDUCTION DETECTED ]</h4>
                <h1 id="totalCityCredit">0.00</h1>
            </div>
        </div>

        <div id="cityMap"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDMMwciq6QoLSaWK6xfdr0U3ynyahtoaSk", authDomain: "studio-a33fe.firebaseapp.com", databaseURL: "https://studio-a33fe-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "studio-a33fe", storageBucket: "studio-a33fe.firebasestorage.app", messagingSenderId: "753539109404", appId: "1:753539109404:web:3d916565373b192fe645d9" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);

    const cityMap = L.map('cityMap').setView([16.4322, 102.8236], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; CartoDB' }).addTo(cityMap);

    const getMarkerIcon = (rating) => {
        let color = 'red'; if (rating === 'ดีเยี่ยม') color = 'green'; else if (rating === 'ดีมาก') color = 'blue'; else if (rating === 'ดี') color = 'gold';
        return new L.Icon({ iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`, shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34] });
    };

    async function loadDashboardData() {
        let sumFootprint = 0; let sumCredit = 0;
        try {
            const querySnapshot = await getDocs(collection(db, "carbon_reports"));
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                sumFootprint += data.totalFootprint_kgCO2 || 0; sumCredit += data.totalCredit_kgCO2 || 0;
                if (data.latitude && data.longitude) {
                    let badgeColor = "#ff3366"; if (data.rating === "ดีเยี่ยม") badgeColor = "#00ffcc"; else if (data.rating === "ดีมาก") badgeColor = "#33ccff"; else if (data.rating === "ดี") badgeColor = "#ffcc00";
                    const marker = L.marker([data.latitude, data.longitude], { icon: getMarkerIcon(data.rating) }).addTo(cityMap);
                    marker.bindPopup(`<div style="font-family: monospace; text-align:center;"><b>${data.organization}</b><br><span style="color:${badgeColor}">[ ${data.rating} ]</span></div>`);
                }
            });
            document.getElementById('totalCityFootprint').innerText = sumFootprint.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('totalCityCredit').innerText = sumCredit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('loading').style.display = 'none';
            document.getElementById('summaryGrid').style.display = 'grid';
        } catch (error) { document.getElementById('loading').innerText = "SYS_ERROR: UNABLE TO FETCH SATELLITE DATA."; }
    }
    loadDashboardData();
</script>
</body>
</html>
