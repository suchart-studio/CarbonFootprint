<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OVERRIDE - Khon Kaen</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #030a10; --bg-panel: rgba(3, 20, 25, 0.9);
            --glow-green: #00ffcc; --glow-red: #ff3366; --text-main: #e0f8f5;
        }
        body { font-family: 'Chakra Petch', monospace; background-color: var(--bg-base); color: var(--text-main); margin: 0; padding: 20px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); border: 1px solid var(--glow-green); padding: 15px 20px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(0,255,204,0.2); }
        .header h2 { margin: 0; color: var(--glow-red); text-shadow: 0 0 5px var(--glow-red); }
        .header a { color: var(--glow-green); text-decoration: none; font-family: monospace; }
        
        .table-container { background: var(--bg-panel); border: 1px solid #1a365d; padding: 10px; overflow-x: auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; font-family: monospace; font-size: 14px;}
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1a365d; }
        th { background-color: rgba(0, 255, 204, 0.1); color: var(--glow-green); }
        tr:hover { background-color: rgba(255,255,255,0.05); }
        
        .badge { padding: 4px 8px; color: #000; font-weight: bold; border-radius: 2px; }
        .btn { padding: 6px 12px; border: 1px solid; cursor: pointer; font-family: monospace; background: transparent; transition: 0.3s; }
        .btn-edit { color: #ffcc00; border-color: #ffcc00; margin-right: 5px; }
        .btn-edit:hover { background: #ffcc00; color: #000; box-shadow: 0 0 10px #ffcc00; }
        .btn-delete { color: var(--glow-red); border-color: var(--glow-red); }
        .btn-delete:hover { background: var(--glow-red); color: #000; box-shadow: 0 0 10px var(--glow-red); }

        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--bg-base); border: 1px solid var(--glow-green); padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        .modal-content h3 { margin-top: 0; color: var(--glow-green); }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #1a365d; font-family: monospace; box-sizing: border-box; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;}
    </style>
</head>
<body>

    <div class="header">
        <h2>⚠️ SYS_ADMIN: ROOT ACCESS</h2>
        <a href="index.html">[ TERMINATE SESSION ]</a>
    </div>

    <div class="table-container">
        <table>
            <thead><tr><th>TIMESTAMP</th><th>ORG_IDENTIFIER</th><th>EMISSION</th><th>CREDIT</th><th>NEUTRAL (%)</th><th>STATUS</th><th>OVERRIDE</th></tr></thead>
            <tbody id="tableBody"><tr><td colspan="7" style="text-align: center; color: var(--glow-green);">FETCHING DATABASE...</td></tr></tbody>
        </table>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>>> MODIFY RECORD</h3>
            <input type="hidden" id="editDocId">
            <label style="color:#81e6d9; font-size:12px;">ORG_IDENTIFIER:</label><input type="text" id="editOrgName">
            <label style="color:#81e6d9; font-size:12px;">EMISSION (FOOTPRINT):</label><input type="number" id="editFootprint" step="any">
            <label style="color:#81e6d9; font-size:12px;">CREDIT (REDUCTION):</label><input type="number" id="editCredit" step="any">
            <div class="modal-actions">
                <button class="btn" style="color:#aaa; border-color:#aaa;" onclick="closeModal()">CANCEL</button>
                <button class="btn" style="color:var(--glow-green); border-color:var(--glow-green);" id="saveEditBtn">COMMIT CHANGES</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDMMwciq6QoLSaWK6xfdr0U3ynyahtoaSk", authDomain: "studio-a33fe.firebaseapp.com", databaseURL: "https://studio-a33fe-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "studio-a33fe", storageBucket: "studio-a33fe.firebasestorage.app", messagingSenderId: "753539109404", appId: "1:753539109404:web:3d916565373b192fe645d9" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app);
    let reportList = [];

    const getBadge = (rating) => {
        let bg = "#ff3366"; if(rating==="ดีเยี่ยม") bg="#00ffcc"; else if(rating==="ดีมาก") bg="#33ccff"; else if(rating==="ดี") bg="#ffcc00";
        return `<span class="badge" style="background-color: ${bg}; box-shadow: 0 0 5px ${bg};">${rating}</span>`;
    };

    async function loadData() {
        const tbody = document.getElementById('tableBody'); tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">FETCHING...</td></tr>';
        try {
            const querySnapshot = await getDocs(collection(db, "carbon_reports")); reportList = []; tbody.innerHTML = '';
            querySnapshot.forEach((doc) => {
                const data = doc.data(); reportList.push({ id: doc.id, ...data });
                let dateStr = "N/A"; if (data.timestamp) { const d = data.timestamp.toDate ? data.timestamp.toDate() : new Date(data.timestamp); dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString(); }
                tbody.innerHTML += `<tr><td style="color:#64748b;">${dateStr}</td><td>${data.organization}</td><td style="color:#ff3366;">${data.totalFootprint_kgCO2}</td><td style="color:#00ffcc;">${data.totalCredit_kgCO2}</td><td>${data.compensationPercent}%</td><td>${getBadge(data.rating)}</td><td><button class="btn btn-edit" onclick="openEditModal('${doc.id}')">EDIT</button> <button class="btn btn-delete" onclick="deleteRecord('${doc.id}')">PURGE</button></td></tr>`;
            });
        } catch (e) { tbody.innerHTML = '<tr><td colspan="7" style="color:red; text-align:center;">SYS_ERROR: DB READ FAILED.</td></tr>'; }
    }

    window.deleteRecord = async (docId) => {
        if (confirm(`WARNING: PURGE RECORD PERMANENTLY?`)) {
            try { await deleteDoc(doc(db, "carbon_reports", docId)); loadData(); } catch (e) { alert("PURGE FAILED."); }
        }
    };

    window.openEditModal = (docId) => {
        const data = reportList.find(item => item.id === docId);
        if (data) { document.getElementById('editDocId').value = docId; document.getElementById('editOrgName').value = data.organization; document.getElementById('editFootprint').value = data.totalFootprint_kgCO2; document.getElementById('editCredit').value = data.totalCredit_kgCO2; document.getElementById('editModal').style.display = 'flex'; }
    };

    window.closeModal = () => document.getElementById('editModal').style.display = 'none';

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
        const docId = document.getElementById('editDocId').value; const orgName = document.getElementById('editOrgName').value;
        const newFootprint = parseFloat(document.getElementById('editFootprint').value) || 0; const newCredit = parseFloat(document.getElementById('editCredit').value) || 0;
        let compensationPercent = newFootprint > 0 ? (newCredit / newFootprint) * 100 : (newCredit > 0 ? 100 : 0);
        let rating = "ต้องปรับปรุง"; if (compensationPercent >= 50) rating = "ดีเยี่ยม"; else if (compensationPercent >= 30) rating = "ดีมาก"; else if (compensationPercent >= 10) rating = "ดี";
        
        try { await updateDoc(doc(db, "carbon_reports", docId), { organization: orgName, totalFootprint_kgCO2: Number(newFootprint.toFixed(2)), totalCredit_kgCO2: Number(newCredit.toFixed(2)), compensationPercent: Number(compensationPercent.toFixed(2)), rating: rating }); closeModal(); loadData(); } catch (e) { alert("UPDATE FAILED."); }
    });

    loadData();
</script>
</body>
</html>
