<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khon Kaen Carbon Tracker</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
        button:hover { background-color: #218838; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบคำนวณ Carbon Footprint & Credit จ.ขอนแก่น</h2>
    <form id="carbonForm">
        <label>ชื่อหน่วยงาน/องค์กร/ครัวเรือน:</label>
        <input type="text" id="orgName" required placeholder="เช่น บริษัท เอบีซี จำกัด">

        <h3>🔴 ส่วนที่ 1: การปล่อยก๊าซเรือนกระจก</h3>
        <label>การใช้พลังงานไฟฟ้า (หน่วย/เดือน):</label>
        <input type="number" id="electricityUsage" value="0" min="0" step="any" required>
        
        <label>การใช้น้ำมันเชื้อเพลิง (เช่น ดีเซล) (ลิตร/เดือน):</label>
        <input type="number" id="fuelUsage" value="0" min="0" step="any" required>

        <h3>🟢 ส่วนที่ 2: การลดก๊าซเรือนกระจก</h3>
        <label>ขยะที่คัดแยกเพื่อรีไซเคิล (กิโลกรัม/เดือน):</label>
        <input type="number" id="recycledWaste" value="0" min="0" step="any" required>
        
        <label>ไฟฟ้าที่ลดการใช้ได้ / พลังงานทดแทน (หน่วย/เดือน):</label>
        <input type="number" id="savedElectricity" value="0" min="0" step="any" required>

        <button type="submit">คำนวณและส่งรายงาน</button>
    </form>

    <div class="result-box" id="resultBox"></div>
</div>

<!-- Firebase SDK Version 12.12.1 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-analytics.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDMMwciq6QoLSaWK6xfdr0U3ynyahtoaSk",
        authDomain: "studio-a33fe.firebaseapp.com",
        databaseURL: "https://studio-a33fe-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "studio-a33fe",
        storageBucket: "studio-a33fe.firebasestorage.app",
        messagingSenderId: "753539109404",
        appId: "1:753539109404:web:3d916565373b192fe645d9",
        measurementId: "G-537J4GWYLG"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app); // เรียกใช้ Firestore

    // ค่าคงที่สำหรับการคำนวณ (Emission Factors)
    const EF_ELECTRICITY = 0.4999; 
    const EF_DIESEL = 2.7446;      
    const EF_RECYCLE = 1.2;        

    document.getElementById('carbonForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // ดึงค่าจากฟอร์ม
        const orgName = document.getElementById('orgName').value;
        const electricity = parseFloat(document.getElementById('electricityUsage').value);
        const fuel = parseFloat(document.getElementById('fuelUsage').value);
        const recycle = parseFloat(document.getElementById('recycledWaste').value);
        const savedElec = parseFloat(document.getElementById('savedElectricity').value);

        // คำนวณ Footprint (สิ่งที่ปล่อย)
        const totalFootprint = (electricity * EF_ELECTRICITY) + (fuel * EF_DIESEL);

        // คำนวณ Credit (สิ่งที่ลดได้)
        const totalCredit = (recycle * EF_RECYCLE) + (savedElec * EF_ELECTRICITY);

        // คำนวณเปอร์เซ็นต์และเกณฑ์การประเมิน
        let compensationPercent = 0;
        if (totalFootprint > 0) {
            compensationPercent = (totalCredit / totalFootprint) * 100;
        } else if (totalCredit > 0) {
            compensationPercent = 100; // กรณีไม่มีการปล่อยเลยแต่มีการลด
        }

        let rating = "ต้องปรับปรุง";
        if (compensationPercent >= 50) rating = "ดีเยี่ยม";
        else if (compensationPercent >= 30) rating = "ดีมาก";
        else if (compensationPercent >= 10) rating = "ดี";

        // เตรียมข้อมูลบันทึกลง Database
        const reportData = {
            organization: orgName,
            totalFootprint_kgCO2: Number(totalFootprint.toFixed(2)),
            totalCredit_kgCO2: Number(totalCredit.toFixed(2)),
            compensationPercent: Number(compensationPercent.toFixed(2)),
            rating: rating,
            timestamp: new Date()
        };

        try {
            // บันทึกข้อมูลลงใน Collection ชื่อ "carbon_reports"
            await addDoc(collection(db, "carbon_reports"), reportData);
            
            // แสดงผลลัพธ์
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.innerHTML = `
                <h3 style="margin-top:0;">รายงานสิ่งแวดล้อม: ${orgName}</h3>
                <p>🔴 ปริมาณคาร์บอนฟุตพริ้นท์: <strong>${reportData.totalFootprint_kgCO2}</strong> kgCO2e</p>
                <p>🟢 ปริมาณคาร์บอนเครดิต (ลดได้): <strong>${reportData.totalCredit_kgCO2}</strong> kgCO2e</p>
                <p>📊 สัดส่วนการชดเชย: <strong>${reportData.compensationPercent}%</strong></p>
                <p>🏆 ระดับการรักษาสิ่งแวดล้อม: <strong style="color: #28a745; font-size: 1.2em;">${rating}</strong></p>
                <hr>
                <p style="color: green; font-size: 0.9em; margin-bottom:0;">✅ บันทึกข้อมูลลงฐานข้อมูลเรียบร้อยแล้ว</p>
            `;
            
            // ล้างค่าในฟอร์มหลังจากส่งข้อมูลสำเร็จ (ถ้าต้องการ)
            // document.getElementById('carbonForm').reset();

        } catch (error) {
            console.error("Error adding document: ", error);
            alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล กรุณาลองใหม่อีกครั้ง");
        }
    });
</script>
</body>
</html>
